<!doctype html><html><head><meta charset="utf-8">
<style>body{margin:0;background:#222}</style></head><body>
<canvas id="c" width="960" height="540"></canvas>
<script src="jizura.js"></script>
<script>
window.T = {
  async setup(p){ this.project = Object.assign(J.defaultProject(), p||{}); if (p && p.fx) this.project.fx = Object.assign(J.defaultProject().fx, p.fx); this.plan = J.plan(this.project, p && p.__audio ? p.__audio : null);
    await J.ensureFonts(this.project.lyrics + (this.project.title||'') + '0123456789XYLINEREC:/.・【】No', null);
    this.r = new J.Renderer(); return {dur:this.plan.duration, cuts:this.plan.cuts.map(c=>[c.text,c.layout,c.enter,c.exit,c.start.toFixed(2),c.end.toFixed(2),c.scheme, c.decor.map(d=>d.id).join('+'), c.treat, c.bg, c.cam])}; },
  cutInfo(){ return this.plan.cuts.map(c=>({text:c.text,layout:c.layout,enter:c.enter,exit:c.exit,hold:c.hold,start:c.start,end:c.end,inDur:c.inDur,outDur:c.outDur,trans:c.trans,transDur:c.transDur,decor:c.decor.map(d=>d.id),treat:c.treat,bg:c.bg,cam:c.cam})); },
  setEvents(evs){ this.plan.events = evs; },
  counts(){ return Object.fromEntries(J.GROUP_KEYS.map(g=>[g, J.order(g).length])); },
  ids(g){ return J.order(g).slice(); },
  timeFrames(ts, scale){ const c=document.createElement('canvas'); c.width=Math.round(this.plan.W*scale); c.height=Math.round(this.plan.H*scale); const ctx=c.getContext('2d'); for (const t of ts) this.r.frame(ctx,this.plan,t,{scale,fast:true}); const out=[]; for (const t of ts){ const t0=performance.now(); this.r.frame(ctx,this.plan,t,{scale,fast:true}); out.push(performance.now()-t0);} return out; },
  shot(t, scale){ const c=document.getElementById('c'); scale=scale||0.5; c.width=this.plan.W*scale; c.height=this.plan.H*scale; const ctx=c.getContext('2d'); this.r.frame(ctx,this.plan,t,{scale}); return c.toDataURL('image/png'); },
};
</script></body></html>
